[project]
name = "mcp-montage"
version = "0.6.4"
description = "Project Montage: An open-source project for AI video generation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "google-cloud-storage>=3.13.0",
    "google-genai>=2.12.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pydub>=0.25.1",
    "pyopenssl<26.2.0",
    "python-dotenv>=1.2.2",
    "torch>=2.11,<2.13",
    "torchaudio>=2.11.0",
    "torchcodec>=0.15.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
]
lint = [
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemas", "services", "shared", "utils", "tools"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }
