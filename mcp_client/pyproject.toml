[project]
name = "mcp_client"
version = "0.5.1"
description = "Project Montage: An open-source project for AI video generation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "google-adk[all]>=2.4.0",
    "google-cloud-storage>=3.13.0",
    "json-repair>=0.61.5",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
]
lint = [
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adk", "shared", "utils"]

[tool.uv]
package = true
